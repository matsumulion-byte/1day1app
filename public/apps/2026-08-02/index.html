<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#f4efe4" />
  <meta name="description" content="5つの質問で、今日のあなたにぴったりなおやつを診断します。" />
  <title>きょうのおやつ</title>
  <link rel="stylesheet" href="/apps/2026-08-02/styles.css" />
</head>
<body>
  <main class="app-shell">
    <header class="site-head">
      <span class="brand">1DAY 1APP</span>
      <span>8月2日・おやつの日</span>
    </header>

    <section class="screen intro active" id="intro">
      <div class="snack-scene" aria-hidden="true">
        <span class="plate"></span><span class="fork">♢</span>
        <span class="steam steam-one"></span><span class="steam steam-two"></span>
        <span class="bowl"><i></i></span>
      </div>
      <div class="intro-copy">
        <p class="kicker">OYATSU FINDER</p>
        <h1>きょうの<br><em>おやつ</em></h1>
        <p class="tagline">さて、何を食べようか。</p>
        <button class="primary" id="start">診断する <span>→</span></button>
        <p class="small-note">全5問・だいたい30秒</p>
      </div>
      <p class="side-copy">甘くても、しょっぱくても、すすっても。</p>
    </section>

    <section class="screen quiz" id="quiz">
      <div class="quiz-top">
        <button class="back" id="back" aria-label="前の質問へ">←</button>
        <p><span id="question-number">01</span> / 05</p>
        <div class="progress"><i id="progress"></i></div>
      </div>
      <div class="question-wrap">
        <p class="kicker" id="question-kicker"></p>
        <h2 id="question"></h2>
        <div class="answers" id="answers"></div>
      </div>
    </section>

    <section class="screen result" id="result">
      <div class="result-card">
        <p class="kicker">TODAY'S OYATSU</p>
        <p class="result-label">きょうのあなたのおやつは</p>
        <div class="food-visual" id="food-visual" aria-hidden="true"><span id="food-emoji"></span></div>
        <h2 id="food-name"></h2>
        <p class="result-copy" id="result-copy"></p>
        <div class="receipt">
          <span>本日の気分</span><b id="mood-label"></b>
          <span>満足度</span><b id="satisfaction"></b>
        </div>
        <button class="primary" id="retry">もう一度えらぶ <span>↻</span></button>
      </div>
      <p class="result-foot">おやつに正解はありません。食べたいものが、きょうのおやつ。</p>
    </section>
  </main>
  <script src="/apps/2026-08-02/script.js"></script>
</body>
</html>
