<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f3b51b">
  <meta name="description" content="食用油から油小路の変まで。世の中の「油」を10問出題。">
  <title>油クイズ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@600;700;800&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/apps/2026-08-23/styles.css">
</head>
<body>
  <div class="sunburst" aria-hidden="true"></div>
  <main class="app-shell">
    <header class="brand"><span class="drop">●</span><span>ABURA QUIZ</span><span class="date">08.23</span></header>

    <section id="start-screen" class="screen start-screen active">
      <div class="eyebrow">8月23日・油の日</div>
      <div class="oil-can" aria-hidden="true"><span></span><b>油</b></div>
      <h1>油クイズ</h1>
      <p class="lead">食用油から油小路の変まで。<br>世の中の「油」を10問出題。</p>
      <div class="pool-note"><strong>全56問</strong>からランダム出題</div>
      <button id="start-button" class="primary-button">油クイズをはじめる <span>→</span></button>
      <p class="tiny-note">ジャンルは毎問、節操なく飛びます。</p>
    </section>

    <section id="quiz-screen" class="screen quiz-screen" aria-live="polite">
      <div class="status-row">
        <div><span class="status-label">QUESTION</span><strong id="progress">1 / 10</strong></div>
        <div class="score-box"><span>正解</span><strong id="score">0</strong></div>
      </div>
      <div class="progress-track"><div id="progress-bar"></div></div>
      <article class="question-card">
        <div class="category-tag" id="category">文化</div>
        <h2 id="question"></h2>
        <div id="choices" class="choices"></div>
        <div id="feedback" class="feedback" hidden>
          <div id="verdict" class="verdict"></div>
          <p id="explanation"></p>
          <button id="next-button" class="next-button">次の問題へ <span>→</span></button>
        </div>
      </article>
    </section>

    <section id="result-screen" class="screen result-screen">
      <div class="result-kicker">RESULT</div>
      <div class="result-drop" aria-hidden="true">油</div>
      <p class="result-score"><strong id="final-score">7</strong><span> / 10問正解</span></p>
      <div class="deviation"><span>油偏差値</span><strong id="deviation">63</strong></div>
      <p class="title-label">あなたの称号</p>
      <h2 id="rank">油博士</h2>
      <p id="comment" class="result-comment"></p>
      <button id="share-button" class="primary-button share-button">結果をシェア <span>↗</span></button>
      <button id="retry-button" class="text-button">もう一度、油にまみれる</button>
    </section>
  </main>
  <footer>油断せず、油断を楽しむ。<span>ABURA QUIZ © 2026</span></footer>
  <script src="/apps/2026-08-23/script.js"></script>
</body>
</html>
