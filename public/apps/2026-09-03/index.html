<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#fff4fa">
  <meta name="description" content="9月3日・グミの日に遊ぶ、ぷるぷる爽快な落ちものパズルゲーム。">
  <title>グミぐみパズル｜9月3日 グミの日</title>
  <link rel="stylesheet" href="/apps/2026-09-03/styles.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand"><span class="date">9.3 GUMMY DAY</span><h1>グミぐみパズル</h1></div>
      <div class="sound-controls" aria-label="サウンド設定">
        <button id="bgmToggle" class="sound-button" type="button" aria-pressed="true">♪ BGM <b>ON</b></button>
        <button id="voiceToggle" class="sound-button" type="button" aria-pressed="true">● VOICE <b>ON</b></button>
      </div>
    </header>

    <section class="hud" aria-label="ゲーム情報">
      <div class="stat"><span>SCORE</span><strong id="score">0</strong><small>BEST <b id="highScore">0</b></small></div>
      <div class="next-box"><span>NEXT</span><canvas id="nextCanvas" width="150" height="66" aria-label="次のグミ"></canvas></div>
      <div class="stat right"><span>BEST CHAIN</span><strong id="bestChain">0</strong><small>THIS GAME <b id="gameChain">0</b></small></div>
    </section>

    <section id="gameArea" class="game-area" aria-label="グミぐみパズル ゲーム盤">
      <canvas id="gameCanvas" width="360" height="720"></canvas>
      <div id="chainText" class="chain-text" aria-live="polite"></div>
      <div class="board-gloss" aria-hidden="true"></div>
    </section>

    <p class="hint"><span class="pc-hint">← → 移動　↓ 高速落下　↑ / SPACE 回転</span><span class="touch-hint">スワイプで移動・落下　タップで回転</span></p>

    <div id="startScreen" class="overlay title-screen">
      <div class="splash-gummies" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
      <div class="overlay-card">
        <span class="date-pill">9月3日　グミの日</span>
        <h2>グミぐみ<br><em>パズル</em></h2>
        <p>ぷるぷるつなげて、グミ連鎖！</p>
        <button id="startButton" class="primary-button" type="button">START</button>
        <small>同じ色を4つ以上つなげよう</small>
      </div>
    </div>

    <div id="gameOverScreen" class="overlay hidden" role="dialog" aria-modal="true" aria-labelledby="gameOverTitle">
      <div class="overlay-card result-card">
        <span id="recordBadge" class="record-badge hidden">NEW RECORD!</span>
        <p class="overline">ぷるぷる終了！</p>
        <h2 id="gameOverTitle">GAME OVER</h2>
        <div class="result-grid"><div><span>SCORE</span><strong id="finalScore">0</strong></div><div><span>MAX CHAIN</span><strong id="finalChain">0</strong></div></div>
        <button id="restartButton" class="primary-button" type="button">もう一回</button>
      </div>
    </div>
  </main>

  <audio id="bgm" loop preload="auto"></audio>
  <script src="/apps/2026-09-03/script.js"></script>
</body>
</html>
