<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#39372f"><meta name="description" content="言葉の音を分解して、無理やりダジャレにする研究機。"><title>だじゃれ製造機</title><link rel="stylesheet" href="/apps/2026-09-01/css/style.css"></head><body>
<main class="machine"><header><div class="plate"><span>九月一日記念</span><b>言語遊戯研究所</b></div><div class="meters" aria-hidden="true"><div class="meter"><i></i><span>親父度</span></div><div class="lamps"><i></i><i></i><i></i></div></div><p class="eyebrow">DAJARE FABRICATOR № 091</p><h1>だじゃれ<br><em>製造機</em></h1><p class="sub">あなたの言葉を、<strong>無理やり</strong>ダジャレにします。</p></header>
<section class="console" aria-labelledby="input-label"><label id="input-label" for="word">だじゃれにしたい言葉</label><div class="input-wrap"><input id="word" maxlength="24" autocomplete="off" enterkeyhint="go" placeholder="アルミ缶"><span class="counter"><b id="count">0</b>/24</span></div><div class="examples"><span>試運転：</span><button data-word="布団">布団</button><button data-word="校長">校長</button><button data-word="トイレ">トイレ</button></div><button class="generate" id="generate"><span>ダジャレる</span><small>PUSH TO PUN</small></button><p class="error" id="error" role="alert"></p></section>
<section class="processing" id="processing" hidden aria-live="polite"><div class="tape"><span></span></div><div class="gear">歯</div><p id="status">音声解析中…</p><small>しばらくお寒いままお待ちください</small></section>
<section class="results" id="results" hidden aria-live="polite"><div class="result-head"><div><span>製造完了</span><h2>診断結果</h2></div><div class="stamp">検品<br>済</div></div><p class="reading" id="reading"></p><div id="cards" class="cards"></div><div class="actions"><button id="retry" class="secondary">↻ もう一回ダジャレる</button><button id="copy" class="secondary">▣ 結果をコピー</button><button id="share" class="secondary" hidden>↗ シェア</button></div></section>
<footer><p>9.1 だじゃれの日｜外部AI不使用・人力風味100%</p><p>※笑いの品質は保証いたしかねます。</p></footer></main>
<script src="/apps/2026-09-01/js/dictionary.js"></script><script src="/apps/2026-09-01/js/templates.js"></script><script src="/apps/2026-09-01/js/pun-generator.js"></script><script src="/apps/2026-09-01/js/app.js"></script></body></html>
