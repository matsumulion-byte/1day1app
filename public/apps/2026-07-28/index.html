<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4efe3">
  <meta name="description" content="全国50の難読地名から、ランダムに10問出題する4択クイズ。">
  <title>読める？ニッポン｜難読地名クイズ</title>
  <link rel="stylesheet" href="/apps/2026-07-28/styles.css">
</head>
<body>
  <main class="app">
    <section class="screen intro active" id="intro">
      <div class="map-mark" aria-hidden="true">
        <span>?</span>
      </div>
      <p class="date-label">7月28日 · 地名の日</p>
      <h1><span>読める？</span>ニッポン</h1>
      <p class="lead">知っているようで、読めない。<br>全国難読地名クイズ</p>
      <div class="intro-data" aria-label="クイズ概要">
        <div><b>50</b><span>地名を収録</span></div>
        <i></i>
        <div><b>10</b><span>問をランダム出題</span></div>
      </div>
      <button class="primary-button" id="startButton" type="button">日本一周に出発</button>
      <p class="tiny">4択から正しい読み方を選ぼう</p>
    </section>

    <section class="screen quiz" id="quiz">
      <header class="quiz-header">
        <button class="quit-button" id="quitButton" type="button" aria-label="最初の画面に戻る">×</button>
        <div class="progress-wrap">
          <div class="progress-meta"><span>Q. <b id="questionNumber">1</b> / 10</span><span id="scoreLabel">0 正解</span></div>
          <div class="progress-track"><span id="progressBar"></span></div>
        </div>
        <div class="streak" id="streakBadge" aria-label="連続正解数">🔥 <b id="streak">0</b></div>
      </header>

      <section class="question-card">
        <p class="prefecture" id="prefecture">北海道</p>
        <p class="prompt">この地名、なんと読む？</p>
        <h2 id="placeName">長万部</h2>
        <div class="stamp" aria-hidden="true">読</div>
      </section>

      <div class="answers" id="answers" aria-label="選択肢"></div>

      <section class="feedback" id="feedback" aria-live="polite">
        <div class="feedback-icon" id="feedbackIcon">○</div>
        <div>
          <p id="feedbackTitle">正解！</p>
          <p id="feedbackReading">長万部〈おしゃまんべ〉</p>
        </div>
        <button id="nextButton" type="button">次の問題へ <span>→</span></button>
      </section>
    </section>

    <section class="screen result" id="result">
      <p class="date-label">日本一周 完了</p>
      <div class="result-ring">
        <span>10問中</span>
        <strong id="finalScore">8</strong>
        <span>問正解</span>
      </div>
      <p class="rank-label">あなたの称号</p>
      <h2 id="rankTitle">地名博士</h2>
      <p class="result-copy" id="resultCopy">地図を見る目が変わるかも。</p>
      <div class="missed" id="missed">
        <p>復習しておこう</p>
        <div id="missedList"></div>
      </div>
      <button class="primary-button" id="retryButton" type="button">別の10問に挑戦</button>
      <button class="share-button" id="shareButton" type="button">結果をシェア</button>
    </section>
  </main>
  <script src="/apps/2026-07-28/script.js"></script>
</body>
</html>
