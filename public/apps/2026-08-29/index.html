<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#24130f">
  <title>焼肉奉行</title>
  <link rel="stylesheet" href="/apps/2026-08-29/styles.css">
</head>
<body>
  <main class="app">
    <header class="header">
      <div class="brand"><span>炎</span><h1>焼肉奉行</h1></div>
      <div class="hud" aria-label="ゲーム情報">
        <div><small>スコア</small><strong id="score">0</strong></div>
        <div><small>のこり</small><strong><span id="time">60</span><i>秒</i></strong></div>
        <div><small>コンボ</small><strong><span id="combo">0</span><i>連</i></strong></div>
      </div>
    </header>

    <section class="counter">
      <div class="order"><span class="lamp"></span><span id="message">網は熱々。準備よし！</span></div>
      <div class="legend"><span>🥩 生</span><span>🟠 食べごろ</span><span>⬛ 焦げ</span></div>
    </section>

    <section id="grill" class="grill" aria-label="焼き網"></section>
    <p class="tap-note">肉をタップ：<b>1回目で裏返す → 2回目で皿へ</b></p>

    <section id="startPanel" class="overlay open">
      <div class="panel start-panel">
        <div class="noren">今宵開店</div>
        <h2>焼肉奉行</h2>
        <p>肉を見極め、<b>食べごろで裏返し</b><br>もう一度食べごろになったら<b>皿へ！</b></p>
        <div class="howto">
          <div><span>①</span><b>肉を1回タップ</b><small>片面目を裏返す</small></div>
          <div class="arrow">›</div>
          <div><span>②</span><b>もう1回タップ</b><small>両面焼いて皿へ</small></div>
        </div>
        <p class="hint">色とゲージがオレンジの時が狙い目。<br>肉によって焼ける速さが違います。</p>
        <button id="startButton" type="button">🔥 網に火を入れる</button>
      </div>
    </section>

    <section id="resultPanel" class="overlay" aria-hidden="true">
      <div class="panel result-panel">
        <p class="eyebrow">本日の焼き上がり</p>
        <h2 id="title">焼肉奉行</h2>
        <div class="power"><span id="power">0</span><small>/ 100 奉行力</small></div>
        <div class="result-score"><small>合計スコア</small><strong id="finalScore">0</strong></div>
        <div class="stats">
          <div><span>PERFECT</span><b id="perfectCount">0</b></div>
          <div><span>炭</span><b id="charCount">0</b></div>
          <div><span>最高コンボ</span><b id="maxCombo">0</b></div>
        </div>
        <button id="retryButton" type="button">もう一度焼く</button>
      </div>
    </section>
    <div id="effects" class="effects" aria-live="polite"></div>
  </main>
  <script src="/apps/2026-08-29/script.js"></script>
</body>
</html>
