<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#1f2426">
  <title>駐車場大脱出 | PARK OUT</title>
  <link rel="stylesheet" href="/apps/2026-08-09/styles.css">
</head>
<body>
  <main class="app">
    <header>
      <div class="brand"><span class="brand-mark">P</span><h1>PARK OUT</h1></div>
      <div class="stats"><span>STAGE <b id="stageNumber">01</b></span><span>MOVES <b id="moveCount">0</b></span></div>
    </header>

    <section class="game-shell" aria-label="駐車場スライドパズル">
      <div id="board" class="board">
        <div class="parking-lines" aria-hidden="true"></div>
        <div id="cars" class="cars"></div>
        <div class="exit"><span>EXIT</span><b>→</b></div>
      </div>
    </section>

    <button id="restartButton" class="restart" type="button"><span>↻</span> RESTART</button>
  </main>

  <section id="result" class="result" aria-hidden="true">
    <div class="ticket">
      <div class="ticket-top"><span>PARKING RECEIPT</span><span id="receiptStage">STAGE 01</span></div>
      <div class="out-sign">PARK OUT!</div>
      <div class="result-moves"><span>MOVES</span><strong id="resultMoves">0</strong></div>
      <div class="fee"><span>PARKING FEE</span><strong id="resultFee">¥300</strong></div>
      <div id="resultComment" class="comment">PERFECT PARKING!</div>
      <div class="barcode" aria-hidden="true"></div>
    </div>
    <div class="result-actions">
      <button id="nextButton" type="button">NEXT PARK <span>→</span></button>
      <button id="retryButton" type="button">RETRY</button>
    </div>
  </section>

  <script src="/apps/2026-08-09/script.js"></script>
</body>
</html>
