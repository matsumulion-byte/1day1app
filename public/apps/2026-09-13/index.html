<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#171613"><title>秘孔、うろ覚え</title><link rel="stylesheet" href="/apps/2026-09-13/styles.css"></head>
<body><main><header><a href="#" id="home">秘孔、うろ覚え<span>HIKO MEMORY DOJO</span></a><b id="round">入門</b></header>
<section id="intro"><div class="eyebrow">記憶だけが、頼りだ。</div><h1>秘孔、<br><em>うろ覚え</em><span>。</span></h1><p class="lead">自分の秘孔、覚えてますか。</p><div class="poster"><div class="head"></div><div class="shoulders"></div><i style="left:43%;top:24%">1</i><i style="left:65%;top:59%">2</i><i style="left:31%;top:72%">3</i><strong>覚えろ。<br>そして、突け。</strong></div><button id="camera">写真を撮る <span>↗</span></button><button id="choose" class="secondary">画像を選ぶ <span>＋</span></button><p class="privacy">写真は端末内だけで処理。送信・保存しません。</p><p id="error" role="status"></p></section>
<section id="cameraScreen" hidden><h2>顔と肩を、枠の中へ。</h2><div class="frame"><video id="video" autoplay muted playsinline></video><div class="guide"><div></div><span>顔と肩を合わせる</span></div></div><button id="capture">この瞬間を撮る</button><button id="cancelCamera" class="secondary">戻る</button></section>
<section id="editor" hidden><h2>この身体で、挑む。</h2><p class="sub">ドラッグで移動・ピンチで拡大縮小</p><div class="frame" id="cropFrame"><canvas id="crop" width="720" height="960"></canvas><div class="guide"><div></div><span>顔と肩を合わせる</span></div></div><label class="zoom">− <input id="zoom" type="range" min="1" max="4" step="0.01" value="1" aria-label="写真の拡大率"> ＋</label><button id="start">この写真で始める</button><button id="reselect" class="secondary">写真を選び直す</button></section>
<section id="game" hidden><div class="command"><h2 id="command">覚えろ</h2><span id="instruction">番号の順番を記憶</span></div><div class="frame" id="arena"><canvas id="photo" width="720" height="960"></canvas><div id="points"></div><div id="healing"></div><div id="impact"></div></div><div class="timer"><i id="timer"></i></div><div id="result" hidden aria-live="polite"><h2 id="resultTitle"></h2><p id="resultSub"></p><button id="next"></button><button id="change" class="secondary" hidden>写真を変える</button></div><p id="gameHint" class="privacy">位置と順番を覚えて、番号が消えたらタップ。</p></section>
<footer>一撃の記憶。うろ覚えの奥義。<span>※治療効果のない記憶ゲームです。</span></footer></main><canvas id="fx"></canvas><input type="file" id="file" accept="image/*" hidden><script src="/apps/2026-09-13/script.js"></script></body></html>
