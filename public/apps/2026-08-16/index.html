<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07101d">
  <meta name="description" content="この夏、燃やして送りたいものを夜の山に灯す、送り火メーカー。">
  <title>送り火メーカー</title>
  <link rel="stylesheet" href="/apps/2026-08-16/styles.css">
</head>
<body>
  <main class="app-shell">
    <header class="hero-copy">
      <p class="date-label">8月16日、夏の夜</p>
      <h1>送り火メーカー</h1>
      <p>この夏、燃やして送りたいものは？</p>
    </header>

    <section class="scene-frame" id="sceneFrame" aria-label="夜の山の送り火">
      <canvas id="sceneCanvas"></canvas>
      <div class="scene-caption" aria-hidden="true">遠くの山へ、そっと。</div>
    </section>

    <section class="controls" aria-label="送りたいものを入力">
      <form id="fireForm" novalidate>
        <div class="input-wrap">
          <input id="wishInput" type="text" maxlength="12" inputmode="text" autocomplete="off"
            enterkeyhint="go" placeholder="例：残業、脂肪、黒歴史" aria-describedby="inputMeta errorMessage">
          <span id="inputMeta" class="count"><span id="charCount">0</span>/12</span>
        </div>
        <p id="errorMessage" class="error" role="alert" aria-live="polite"></p>
        <button id="igniteButton" class="primary-button" type="submit">
          <span class="button-icon" aria-hidden="true">🔥</span>
          <span id="igniteLabel">点火する</span>
        </button>
      </form>

      <div id="resultPanel" class="result-panel" aria-live="polite" hidden>
        <p id="resultText" class="result-text"></p>
        <div class="result-actions">
          <button id="retryButton" class="secondary-button" type="button">もう一度送る</button>
          <button id="saveButton" class="save-button" type="button">画像として保存</button>
        </div>
      </div>
    </section>
    <p class="footnote">送り先：どこか遠くの夏山</p>
  </main>
  <script src="/apps/2026-08-16/script.js"></script>
</body>
</html>
