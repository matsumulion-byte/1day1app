<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0875d1">
  <meta name="description" content="名前を入力するだけで、あなただけの野球選手能力を査定。8月26日・パワプロの日の1日1アプリ。">
  <title>名前で選手査定！｜8月26日</title>
  <link rel="stylesheet" href="/apps/2026-08-26/styles.css">
</head>
<body>
  <div class="stadium" aria-hidden="true"><span></span><span></span><span></span></div>
  <main class="app-shell">
    <header class="hero">
      <div class="date-badge"><b>8.26</b><span>BASEBALL DAY</span></div>
      <div>
        <p class="eyebrow">名前で決まる、きみの野球人生。</p>
        <h1>名前で<span>選手査定！</span></h1>
      </div>
      <div class="ball" aria-hidden="true"></div>
    </header>

    <section class="input-panel" aria-labelledby="input-title">
      <div class="step-mark">01</div>
      <div class="input-copy"><h2 id="input-title">選手名を入力</h2><p>同じ名前なら、いつでも同じ査定結果！</p></div>
      <form id="assessment-form" novalidate>
        <label class="sr-only" for="player-name">査定する名前</label>
        <div class="input-wrap"><span aria-hidden="true">⚾</span><input id="player-name" name="name" type="text" maxlength="30" autocomplete="name" enterkeyhint="go" placeholder="例：松村広則"></div>
        <button class="assess-button" type="submit"><span>査定する</span><i aria-hidden="true">▶</i></button>
      </form>
      <p id="error" class="error" role="alert"></p>
    </section>

    <section id="result" class="result" aria-live="polite" aria-atomic="true" hidden>
      <div class="result-flash" aria-hidden="true"></div>
      <div class="player-card">
        <div class="card-topline"><span>PLAYER ASSESSMENT</span><b id="overall-badge">00</b></div>
        <div class="identity">
          <div class="uniform-icon" aria-hidden="true"><span id="uniform-number">1</span></div>
          <div class="identity-main"><p id="position-label">POSITION</p><h2 id="result-name">選手名</h2><div class="meta"><span id="handedness">右投右打</span><span id="position">外野手</span></div></div>
          <div class="type-box"><small>PLAYER TYPE</small><strong id="player-type">万能型</strong></div>
        </div>

        <div class="section-title"><span>基本能力</span><i>BASIC STATUS</i></div>
        <div class="stats" id="stats"></div>

        <div class="evaluation">
          <div><small>総合評価</small><strong id="overall">00</strong><span>/ 100</span></div>
          <p id="comment">その名が、球場をざわつかせる。</p>
        </div>

        <div class="section-title"><span>特殊能力</span><i>SPECIAL SKILLS</i></div>
        <div id="skills" class="skills"></div>
        <p class="skill-note">※ 特殊能力の中には、この査定所だけの未確認能力が含まれています。</p>
      </div>

      <div class="result-actions">
        <button id="retry" class="secondary-button" type="button">↻ もう一度査定</button>
        <button id="share" class="share-button" type="button"><span>𝕏</span> 結果をシェア</button>
      </div>
    </section>
    <footer><span>⚾</span> 8月26日 パワプロの日にちなんだ非公式ファンアプリです。<br>実在のゲーム・団体とは関係ありません。</footer>
  </main>
  <script src="/apps/2026-08-26/script.js"></script>
</body>
</html>
