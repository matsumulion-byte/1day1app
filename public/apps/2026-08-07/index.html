<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#17120e">
  <title>鼻無双｜8月7日は鼻の日</title>
  <meta name="description" content="鼻を振り回して寺を壊せ。芥川龍之介『鼻』モチーフの物理アクション。">
  <link rel="stylesheet" href="/apps/2026-08-07/styles.css?v=2">
</head>
<body>
  <main class="app">
    <header>
      <div><span class="date">8.7 / 鼻の日</span><h1>鼻無双</h1></div>
      <button id="soundBtn" type="button" aria-label="音を切り替える">音 ON</button>
    </header>

    <section class="hud" aria-label="ゲーム情報">
      <div><small>自尊心</small><strong id="score">0</strong></div>
      <div class="combo"><small>連撃</small><strong id="combo">×1</strong></div>
      <div class="time"><small>残り</small><strong><b id="time">45</b>秒</strong></div>
    </section>

    <section id="stage" class="stage" aria-label="鼻を振り回すゲーム画面">
      <canvas id="game"></canvas>
      <div id="intro" class="overlay intro">
        <div class="book">芥川龍之介『鼻』× 鼻の日</div>
        <h2>鼻を振って<br><em>全部ぶっ飛ばせ。</em></h2>
        <p>カーソルを動かすだけ。鼻はどこまでもついてくる。</p>
        <button id="startBtn" type="button">いざ、無双</button>
        <small>マウスを動かす / 指でなぞる</small>
      </div>
      <div id="result" class="overlay result" hidden>
        <span>本日の自尊心</span>
        <strong id="finalScore">0</strong>
        <h2 id="rank">鼻たれ小僧</h2>
        <p id="summary">0個をなぎ倒した</p>
        <button id="retryBtn" type="button">もう一度暴れる</button>
      </div>
      <div id="toast" class="toast">壺を破壊！</div>
      <div class="hint" id="hint"><span>☝</span> 画面をぐるぐるなぞれ！</div>
    </section>

    <section class="mission">
      <div><span>大鐘まで</span><strong id="bellCount">あと 12破壊</strong></div>
      <div class="bar"><i id="progress"></i></div>
      <p>壺や坊主を吹き飛ばし、大鐘を鳴らせ！</p>
    </section>
  </main>
  <script src="/apps/2026-08-07/script.js?v=2"></script>
</body>
</html>
