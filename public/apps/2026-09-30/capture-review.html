<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>全アプリのキャプチャ | 1日1アプリ</title>
    <link rel="stylesheet" href="/apps/2026-09-30/capture-review.css" />
  </head>
  <body>
    <header>
      <small>1 DAY / 1 APP — CAPTURE ARCHIVE</small>
      <h1>1年分の画面。</h1>
      <p id="summary">撮影結果を読み込んでいます…</p>
      <div>
        <input
          id="query"
          aria-label="日付・タイトルで検索"
          placeholder="日付・タイトルで検索"
        /><select id="filter" aria-label="撮影結果を絞り込み">
          <option value="all">すべて</option>
          <option value="captured">撮影済み</option>
          <option value="warning">要確認</option>
          <option value="failed">取得失敗</option></select
        ><a href="/apps/2026-09-30/apps.captured.json" target="_blank"
          >取り込み用JSON ↗</a
        >
      </div>
      <p class="note">
        公開サイトの初期画面を撮影。ボタン操作・ログインは行っていません。画像を押すとキャプチャ原寸、タイトルを押すと実際のサイトを開きます。
      </p>
    </header>
    <main id="grid"></main>
    <script type="module" src="/apps/2026-09-30/capture-review.js"></script>
  </body>
</html>
