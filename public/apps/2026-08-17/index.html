<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#030813">
  <title>ナイター配線職人</title>
  <link rel="stylesheet" href="/apps/2026-08-17/styles.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div><p class="date">8.17｜プロ野球ナイター記念日</p><h1>ナイター配線職人</h1></div>
      <button id="soundBtn" class="icon-btn" aria-label="サウンド切替">♪</button>
    </header>
    <section class="hud" aria-label="ゲーム情報">
      <div><span>STAGE</span><strong id="levelName">LEVEL 1</strong></div>
      <div><span>TIME</span><strong id="timer">00:00</strong></div>
      <div><span>LIGHTS</span><strong id="towerReadout">0 / 2</strong></div>
      <div><span>CABLE</span><strong id="cableReadout">READY</strong></div>
      <button id="resetBtn">↻ やり直す</button>
    </section>
    <section id="gameShell" class="game-shell">
      <canvas id="game" aria-label="野球場の配線パズル"></canvas>
      <div id="toast" class="toast" role="status"></div>
      <div id="spark" class="spark">バチッ</div>
      <div id="startBanner" class="start-banner">NIGHT GAME<br><b>START!</b></div>
      <div id="tutorial" class="tutorial"><b>全通路をちょうど一度！</b><br>⚡から一筆書きで IN へ</div>
    </section>
    <nav id="levelNav" class="level-nav" aria-label="ステージ選択"></nav>
    <p id="stageSubtitle" class="hint">まずは一本、つないでみよう</p>
  </main>
  <dialog id="resultDialog">
    <div class="result-card">
      <p class="result-kicker">全照明、点灯完了</p>
      <h2>NIGHT GAME START!</h2>
      <div id="rankBadge" class="rank-badge">球場照明マスター</div>
      <dl><div><dt>通過区間</dt><dd id="resultLength">0区間</dd></div><div><dt>引き直し</dt><dd id="resultRetries">0回</dd></div><div><dt>クリアタイム</dt><dd id="resultTime">00:00</dd></div></dl>
      <button id="nextBtn" class="primary">次の球場へ</button>
      <button id="replayBtn" class="secondary">もう一度</button>
    </div>
  </dialog>
  <script src="/apps/2026-08-17/stages-euler.js"></script>
  <script src="/apps/2026-08-17/script-euler.js"></script>
</body>
</html>
