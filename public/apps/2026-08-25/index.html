<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#eee9dc">
  <meta name="description" content="押すたびに、松村がふいに現れる。8月25日・川柳発祥の日のランダム川柳メーカー。">
  <title>松村川柳</title>
  <link rel="stylesheet" href="/apps/2026-08-25/styles.css">
</head>
<body>
  <main class="app">
    <header class="title-block">
      <p class="date">八月二十五日　川柳発祥の日</p>
      <h1>松村川柳</h1>
      <p class="lead">五・七・五の、どこかに松村。</p>
    </header>

    <section class="senryu-card" aria-label="生成された川柳">
      <span class="thread" aria-hidden="true"></span>
      <div id="senryu" class="senryu" aria-live="polite" aria-atomic="true">
        <p class="line"></p>
        <p class="line"></p>
        <p class="line"></p>
      </div>
      <span class="seal" aria-hidden="true">松</span>
    </section>

    <button id="generate" class="generate" type="button">
      <span>もう一句</span><i aria-hidden="true">↻</i>
    </button>
    <p class="hint">押すたび、取り合わせは一期一会。</p>
  </main>
  <script src="/apps/2026-08-25/script.js"></script>
</body>
</html>
