<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="5つの黒から、ただひとつの #000000 を見抜く。9月6日・黒の日のミニゲーム。">
  <title>本物の黒｜9月6日 黒の日</title>
  <link rel="stylesheet" href="/apps/2026-09-06/styles.css">
</head>
<body>
  <main class="experience" id="app">
    <div class="grain" aria-hidden="true"></div>

    <section class="screen intro active" id="introScreen" aria-labelledby="gameTitle">
      <div class="intro-content">
        <p class="eyebrow intro-date">9月6日　黒の日</p>
        <div class="hairline intro-line"></div>
        <p class="catch intro-catch">本物の黒を、見抜け。</p>
        <h1 id="gameTitle"><span>TRUE BLACK</span>本物の黒</h1>
        <p class="brightness">画面の明るさを上げて<br>お楽しみください。</p>
        <button class="cinema-button intro-button" id="startButton">START</button>
      </div>
      <p class="edition">BLACK DAY · 09.06</p>
    </section>

    <section class="screen question" id="questionScreen" aria-live="polite">
      <header class="question-header">
        <p id="questionCount">Q 1 / 5</p>
        <h2 id="difficulty">EASY</h2>
      </header>
      <div class="panel-field" id="panelField" role="group" aria-label="黒の選択肢"></div>
      <footer class="question-footer">
        <div class="hairline"></div>
        <p><span>SELECT THE TRUE BLACK</span>#000000 はどれ？</p>
      </footer>
    </section>

    <section class="screen reveal" id="revealScreen" aria-live="assertive">
      <p class="eyebrow" id="revealKicker">YOUR SELECTION</p>
      <div class="selected-panel" id="selectedPanel"></div>
      <div class="reveal-copy">
        <p class="prelude" id="revealPrelude"></p>
        <h2 id="revealMessage"></h2>
        <code id="selectedCode"></code>
      </div>
      <div class="truth-note" id="truthNote" hidden>
        <span>THE TRUE BLACK</span>
        <i id="truthSwatch"></i>
        <b>#000000</b>
      </div>
      <button class="cinema-button" id="nextButton">NEXT</button>
    </section>

    <section class="screen result" id="resultScreen" aria-labelledby="resultTitle">
      <p class="eyebrow">FINAL RESULT</p>
      <div class="score" id="score">0 <span>/ 5</span></div>
      <div class="hairline"></div>
      <h2 id="resultTitle"></h2>
      <p class="result-caption">あなたが見抜いた、本物の数。</p>
      <button class="cinema-button replay-button" id="replayButton">もう一度、本物の黒を見る</button>
    </section>
  </main>
  <script src="/apps/2026-09-06/script.js"></script>
</body>
</html>
