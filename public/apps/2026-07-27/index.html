<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050606">
  <meta name="description" content="真っ暗な画面で声だけを頼りにスイカを探す、目隠しスイカ割りゲーム。">
  <title>スイカ割ゲーム</title>
  <link rel="stylesheet" href="/apps/2026-07-27/styles.css">
</head>
<body>
  <main class="app">
    <section class="intro active" id="intro">
      <div class="intro-sun" aria-hidden="true"></div>
      <div class="intro-card">
        <p class="eyebrow">7月27日 · スイカの日</p>
        <h1>スイカ割<br>ゲーム</h1>
        <p class="intro-copy">目隠しをしたら、もう何も見えない。<br>みんなの声だけを頼りに進もう。</p>
        <div class="rules">
          <p><b>1</b> 声を聞く</p>
          <p><b>2</b> 矢印で一歩進む</p>
          <p><b>3</b> 「そこ！」で振る</p>
        </div>
        <button class="start-button" id="startButton" type="button">目隠しをする</button>
        <p class="sound-note">音声ONで遊ぶのがおすすめです</p>
      </div>
    </section>

    <section class="blindfold" id="blindfold" aria-label="目隠しスイカ割り">
      <header class="game-header">
        <p>ROUND <b id="round">1</b> / 3</p>
        <button id="soundButton" class="sound-button" type="button" aria-label="音声を切り替える" aria-pressed="true">音声 ON</button>
      </header>

      <div class="darkness" aria-hidden="true">
        <i></i><i></i><i></i><i></i><i></i>
      </div>

      <section class="voice-area" aria-live="assertive" aria-atomic="true">
        <p class="speaker" id="speaker">みんな</p>
        <div class="voice-lines" id="voiceLines"></div>
        <p class="voice-main" id="voiceMain">声を聞いて…</p>
        <p class="voice-sub" id="voiceSub">矢印で一歩ずつ進もう</p>
      </section>

      <div class="steps"><span>残り</span><b id="steps">12</b><span>歩</span></div>

      <section class="controls" id="controls" aria-label="移動操作">
        <button class="direction up" data-move="up" type="button" aria-label="前へ一歩">↑<span>前</span></button>
        <button class="direction left" data-move="left" type="button" aria-label="左へ一歩">←<span>左</span></button>
        <button class="direction right" data-move="right" type="button" aria-label="右へ一歩">→<span>右</span></button>
        <button class="direction down" data-move="down" type="button" aria-label="後ろへ一歩">↓<span>後</span></button>
      </section>

      <button class="swing-button" id="swingButton" type="button">
        <span>棒を振り下ろす</span>
        <small>ここだ！と思ったら押す</small>
      </button>

      <section class="reveal" id="reveal" aria-live="polite">
        <div class="reveal-flash"></div>
        <div class="melon" id="melon"><i></i><i></i><i></i></div>
        <p class="reveal-label" id="revealLabel">命中！</p>
        <p class="reveal-score" id="revealScore">+800</p>
      </section>
    </section>

    <section class="result" id="result">
      <div class="result-card">
        <p class="eyebrow">3 ROUND RESULT</p>
        <h2 id="resultTitle">夏の名人</h2>
        <div class="total"><b id="totalScore">0</b><span>点</span></div>
        <p id="resultCopy"></p>
        <div class="round-results" id="roundResults"></div>
        <button class="start-button" id="retryButton" type="button">もう一度目隠しする</button>
      </div>
    </section>
  </main>
  <script src="/apps/2026-07-27/script.js"></script>
</body>
</html>
