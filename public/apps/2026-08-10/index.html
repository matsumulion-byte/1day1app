<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#16191a">
  <title>バリ取り職人｜0.1mmに魂を込めろ。</title>
  <link rel="stylesheet" href="/apps/2026-08-10/styles.css">
</head>
<body>
  <main class="machine">
    <header class="machine-head">
      <div><p class="eyebrow">AUG.10 / BURR REMOVAL DAY</p><h1>バリ取り職人</h1></div>
      <div class="lamp"><i></i><span id="statusText">準備中</span></div>
    </header>

    <section class="work-area" aria-label="金属パーツ加工エリア">
      <div class="screen-label"><span>WORK SCOPE 01</span><span>PRECISION MODE</span></div>
      <canvas id="gameCanvas" aria-label="指でヤスリを動かしてバリを削るゲーム"></canvas>
      <div id="fileTool" class="file-tool" aria-hidden="true"><span class="grip"></span><span class="rasp"></span></div>
      <div id="guide" class="guide"><b>ヤスリをつかんで</b><span>外周を何度か、やさしくなぞる</span></div>
      <div id="inspection" class="inspection" aria-hidden="true"><i></i></div>
    </section>

    <section id="hud" class="hud">
      <div><span>加工圧</span><b id="pressure">—</b></div>
      <div><span>研磨回数</span><b id="strokeCount">0</b></div>
      <div><span>注意</span><b id="warning">輪郭を守れ</b></div>
    </section>

    <button id="finishButton" class="primary finish" type="button" disabled>仕上げ完了 <span>→</span></button>
    <p class="hint">速さより、精度。削りすぎは大きな減点です。</p>
  </main>

  <section id="titleScreen" class="overlay title-screen">
    <div class="title-plate">
      <p class="eyebrow">8月10日「バリ取りの日」</p>
      <div class="title-icon" aria-hidden="true"><i></i></div>
      <h2>バリ取り職人</h2>
      <p class="soul">0.1mmに魂を込めろ。</p>
      <div class="rule"><span>青い突起を削る</span><span class="danger">赤は削りすぎ</span></div>
      <button id="startButton" class="primary" type="button">バリ取り開始 <span>→</span></button>
    </div>
  </section>

  <section id="resultScreen" class="overlay result-screen" aria-hidden="true">
    <div class="result-card">
      <div class="result-head"><div><p>FINAL INSPECTION REPORT</p><h2>バリ取り職人</h2></div><span>8.10</span></div>
      <div class="score-block"><span>総合スコア</span><strong id="totalScore">—</strong><small>POINTS</small></div>
      <p id="rank" class="rank">検品中…</p>
      <div class="metrics">
        <div><span>仕上がり精度</span><b id="accuracy">—</b></div>
        <div><span><i class="blue"></i>バリ残し</span><b id="burrLeft">—</b></div>
        <div><span><i class="red"></i>削りすぎ</span><b id="overCut">—</b></div>
      </div>
      <div class="stamp"><span>検</span><b>査 済</b></div>
      <p class="result-note">削り跡は毎回変わる。一流の指先は、二度目でも証明できるか。</p>
      <button id="retryButton" class="primary" type="button">もう一度削る <span>↻</span></button>
    </div>
  </section>

  <script src="/apps/2026-08-10/script.js"></script>
</body>
</html>
