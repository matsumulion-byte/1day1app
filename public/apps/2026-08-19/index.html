<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f4f0e7" />
  <meta name="description" content="人間もAIも考えない。偶然の5・7・5から、ときどき名句が生まれる俳句スロット。" />
  <title>俳句スロット｜8月19日 俳句の日</title>
  <link rel="stylesheet" href="/apps/2026-08-19/styles.css" />
</head>
<body>
  <main class="app">
    <header class="masthead">
      <div class="date-mark" aria-hidden="true"><span>八</span><span>一</span><span>九</span></div>
      <div>
        <p class="eyebrow">8月19日・俳句の日</p>
        <h1>俳句<span>スロット</span></h1>
        <p class="intro">考えずに、詠む。<br />偶然だけで生まれる十七音。</p>
      </div>
    </header>

    <section class="machine" aria-label="俳句スロット">
      <div class="machine-top" aria-hidden="true"><span>HAIKU SLOT</span><i></i><i></i><i></i></div>
      <div class="reels" id="reels" aria-live="polite">
        <button class="reel" type="button" data-index="0" aria-label="上五を再抽選">
          <span class="reel-caption">上の句</span><strong class="phrase">夏の雲</strong><span class="mora">五</span>
        </button>
        <button class="reel" type="button" data-index="1" aria-label="中七を再抽選">
          <span class="reel-caption">中の句</span><strong class="phrase">誰も来ないね</strong><span class="mora">七</span>
        </button>
        <button class="reel" type="button" data-index="2" aria-label="下五を再抽選">
          <span class="reel-caption">下の句</span><strong class="phrase">帰りたい</strong><span class="mora">五</span>
        </button>
      </div>
      <p class="tap-hint"><span aria-hidden="true">↻</span> 一段だけ押して詠み直せます</p>
    </section>

    <button class="spin-button" id="spinButton" type="button"><span>一句詠む</span><small>SPIN</small></button>

    <section class="critique" aria-live="polite">
      <span class="seal" aria-hidden="true">評</span>
      <div><p class="critique-label">本日の選評</p><p id="critiqueText">夏の気配を感じます。</p></div>
    </section>

    <div class="share-actions">
      <button id="shareButton" type="button">この一句をシェア <span aria-hidden="true">↗</span></button>
      <button id="copyButton" type="button">コピー</button>
    </div>
    <p class="toast" id="toast" role="status" aria-live="polite"></p>

    <footer>
      <p>人間もAIも、この句を考えていません。</p>
      <span>次こそ、名句。</span>
    </footer>
  </main>
  <script src="/apps/2026-08-19/script.js"></script>
</body>
</html>
