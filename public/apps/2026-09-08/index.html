<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f7f7f4" />
    <meta name="description" content="読めそうで読めない文字を読み解く、国際識字デーのタイポグラフィクイズ。" />
    <title>日本人には読めません</title>
    <link rel="stylesheet" href="/apps/2026-09-08/css/style.css" />
    <script src="/apps/2026-09-08/js/app.js" defer></script>
  </head>
  <body>
    <main class="app" id="app">
      <header class="masthead">
        <p class="date-mark">9.8</p>
        <p>INTERNATIONAL<br />LITERACY DAY</p>
      </header>

      <section class="screen screen--start is-active" id="startScreen" aria-labelledby="title">
        <div class="start-copy">
          <p class="eyebrow">A READING TEST</p>
          <h1 id="title">日本人には<br />読めません</h1>
          <div class="intro">
            <p>この文字、読めますか？</p>
            <p>見えている文字を入力してください。</p>
          </div>
        </div>
        <button class="text-button" id="startButton" type="button" disabled>
          <span id="startButtonLabel">FONT LOADING</span><span aria-hidden="true">→</span>
        </button>
        <p class="font-error" id="fontError" role="alert" hidden>
          Electroharmonixフォントを読み込めませんでした。<br />ページを再読み込みしてください。
        </p>
      </section>

      <section class="screen screen--game" id="gameScreen" aria-label="クイズ" hidden>
        <div class="progress-block">
          <p class="micro-label">QUESTION</p>
          <p class="progress"><span id="questionNumber">1</span> <span>/ 5</span></p>
        </div>

        <div class="question-stage" aria-live="polite">
          <p class="question-word" id="questionWord"></p>
          <p class="feedback" id="feedback" role="status" aria-live="assertive"></p>
        </div>

        <form class="answer-form" id="answerForm" autocomplete="off" novalidate>
          <label class="sr-only" for="answerInput">見えている文字を入力</label>
          <input
            id="answerInput"
            name="answer"
            type="text"
            placeholder="ANSWER"
            autocapitalize="characters"
            autocorrect="off"
            autocomplete="off"
            enterkeyhint="send"
            spellcheck="false"
          />
          <button id="answerButton" type="submit">回答する</button>
        </form>

        <div class="timer" aria-label="経過時間">
          <span>TIME</span><output id="timerOutput">0.0</output><span>SEC</span>
        </div>
      </section>

      <section class="screen screen--result" id="resultScreen" aria-labelledby="resultTitle" hidden>
        <div class="result-copy">
          <p class="eyebrow">COMPLETE</p>
          <h2 id="resultTitle">全問<br />読めました</h2>
          <div class="result-time">
            <span>クリアタイム</span>
            <strong><span id="finalTime">00.0</span><small>秒</small></strong>
          </div>
          <p class="result-comment" id="resultComment"></p>
        </div>
        <button class="text-button" id="retryButton" type="button">
          <span>もう一度</span><span aria-hidden="true">↺</span>
        </button>
      </section>
    </main>
  </body>
</html>
